<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
  <title id="title">Small beginnings, infinite possibilities</title><desc id="desc">Luna's early supporter wallpaper. A luminous crescent among quiet stars and mint and lilac nebulae.</desc>
  <defs>
    <radialGradient id="sky"><stop stop-color="#262641"/><stop offset="1" stop-color="#0c101d"/></radialGradient>
    <radialGradient id="mint"><stop stop-color="#87e7c4" stop-opacity=".18"/><stop offset="1" stop-color="#87e7c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="lilac"><stop stop-color="#b89bea" stop-opacity=".2"/><stop offset="1" stop-color="#b89bea" stop-opacity="0"/></radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef9ed"/><stop offset=".6" stop-color="#c6f4d9"/><stop offset="1" stop-color="#bfb3ef"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>
  <rect width="2560" height="1440" fill="url(#sky)"/><ellipse cx="790" cy="760" rx="1100" ry="820" fill="url(#mint)"/><ellipse cx="1870" cy="430" rx="980" ry="850" fill="url(#lilac)"/>
  <g fill="none" stroke="#bcb2dd" stroke-opacity=".12"><ellipse cx="1280" cy="575" rx="460" ry="350" transform="rotate(-25 1280 575)"/><ellipse cx="1280" cy="575" rx="640" ry="410" transform="rotate(-25 1280 575)"/><circle cx="1280" cy="575" r="480"/></g>
  <path d="M1390 335a246 246 0 1 0 110 423 243 243 0 0 1-110-423Z" fill="#c6f4d9" opacity=".2" filter="url(#glow)"/><path d="M1390 335a246 246 0 1 0 110 423 243 243 0 0 1-110-423Z" fill="url(#moon)"/>
  <g fill="#dfd5f5"><circle cx="485" cy="312" r="3"/><circle cx="735" cy="1035" r="2"/><circle cx="1944" cy="905" r="3"/><circle cx="2010" cy="283" r="2"/><circle cx="1070" cy="220" r="2"/><circle cx="2310" cy="720" r="2"/><circle cx="316" cy="795" r="2"/><circle cx="1700" cy="1120" r="2"/><circle cx="2250" cy="1120" r="2"/><circle cx="815" cy="484" r="3"/></g><g fill="#d6b9ff"><path d="m1760 370 8 23 23 8-23 8-8 23-8-23-23-8 23-8Z"/><path d="m705 770 5 15 15 5-15 5-5 15-5-15-15-5 15-5Z"/></g>
  <text x="1280" y="1030" text-anchor="middle" font-family="Georgia,serif" font-size="64" fill="#f1eef9" letter-spacing="1">Small beginnings, infinite possibilities.</text><text x="1280" y="1110" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#b5b3cc" letter-spacing="7">NEXUS LUNA · EARLY SUPPORTER EDITION</text><text x="1280" y="1320" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#9c9ab4" letter-spacing="3">A LITTLE SPACE FOR YOUR NEXT IDEA</text>
